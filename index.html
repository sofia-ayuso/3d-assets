<body>

<model-viewer
  id="viewer"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  loading="eager">
</model-viewer>

<script>
  const params = new URLSearchParams(window.location.search);
  const model = params.get("model") || "phofinho.glb";
  document.getElementById("viewer").src = "./" + model;
</script>

</body>
